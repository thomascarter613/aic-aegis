services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - aegis-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"

  opa:
    image: openpolicyagent/opa:latest
    container_name: aegis-opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    ports:
      - "8181:8181"
    volumes:
      - ./packages/policy-packs/base:/policies:ro

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: aegis-otel
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otelcol/config.yaml:ro

volumes:
  aegis-postgres-data:
